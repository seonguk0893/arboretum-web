<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>관제 모니터링 | 세종국립수목원 로봇</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/common.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/monitoring.css') }}"
    />
  </head>

  <body>
    <div class="monitor-page">
      <!-- =========================================
         HEADER
    ========================================== -->
      <header class="app-header">
        <div class="header-status">
          <span class="monitor-chip" id="demoChip" hidden>데모 데이터</span>

          <!-- 관제 서버에서 로봇 상태를 받아오는 중인지 -->
          <span class="feed-status" id="feedStatus">
            <i class="feed-dot" aria-hidden="true"></i>
            <span id="feedStatusText">연결 확인 중</span>
          </span>
        </div>
      </header>

      <!-- =========================================
         MAIN
    ========================================== -->
      <main class="monitor-main">
        <!-- 제목 -->
        <section class="monitor-title">
          <div>
            <span class="monitor-label">ROBOT MONITORING</span>
            <h1>관제 모니터링</h1>
          </div>

          <!-- 요약 -->
          <div class="summary" id="summary" aria-label="로봇 상태 요약">
            <div class="summary-item">
              <span>전체</span>
              <strong id="sumTotal">0</strong>
            </div>
            <div class="summary-item ok">
              <span>정상</span>
              <strong id="sumOk">0</strong>
            </div>
            <div class="summary-item warning">
              <span>주의</span>
              <strong id="sumWarning">0</strong>
            </div>
            <div class="summary-item critical">
              <span>이상</span>
              <strong id="sumCritical">0</strong>
            </div>
          </div>
        </section>

        <!-- 이상 상황 알림 (이상이 있을 때만 보임) -->
        <section
          class="alert-banner"
          id="alertBanner"
          role="alert"
          aria-live="assertive"
          hidden
        >
          <div class="alert-banner-head">
            <span class="alert-banner-icon" aria-hidden="true">!</span>
            <strong id="alertBannerTitle"></strong>
          </div>
          <ul id="alertBannerList"></ul>
        </section>

        <!-- 로봇 상태 카드 (monitoring.js 가 robot 수만큼 만든다) -->
        <section class="robot-grid" id="robotGrid" aria-label="로봇 상태">
          <p class="empty-message">로봇 정보를 불러오는 중입니다.</p>
        </section>

        <!-- 알림 이력 -->
        <section class="history" aria-labelledby="historyTitle">
          <div class="history-head">
            <h2 id="historyTitle">알림 이력</h2>
            <span id="historyCount">0건</span>
          </div>

          <div class="history-scroll">
            <table>
              <thead>
                <tr>
                  <th>발생 시각</th>
                  <th>로봇</th>
                  <th>단계</th>
                  <th>내용</th>
                  <th>상태</th>
                </tr>
              </thead>
              <tbody id="historyBody"></tbody>
            </table>

            <p class="empty-message" id="historyEmpty">
              기록된 알림이 없습니다.
            </p>
          </div>
        </section>

        <!-- 이상 상황 화면 확인용 (주소 끝에 ?demo=1 을 붙이면 나타남) -->
        <section class="demo-panel" id="demoPanel" hidden>
          <div class="demo-panel-head">
            <strong>데모 패널</strong>
            <span>
              실제 로봇 없이 이상 상황 화면을 확인합니다. 버튼을 눌러 상황을
              켜고 끄세요.
            </span>
          </div>

          <div class="demo-columns" id="demoColumns"></div>

          <button type="button" class="demo-reset" id="demoReset">
            모두 정상으로
          </button>
        </section>
      </main>
    </div>

    <!-- 로봇 카드 모양 -->
    <template id="robotCardTemplate">
      <article class="robot-card level-waiting">
        <header class="robot-card-head">
          <div class="robot-title">
            <span class="robot-role" data-field="role"></span>
            <h2 data-field="name"></h2>
            <p data-field="area"></p>
          </div>

          <div class="robot-badges">
            <span class="level-chip" data-field="level">수신 대기</span>
            <span class="connection-chip" data-field="connection">
              수신 대기
            </span>
          </div>
        </header>

        <!-- 이 로봇의 이상 상황 문구 (빨간색) -->
        <ul class="robot-alerts" data-field="alerts" hidden></ul>

        <!-- 배터리 -->
        <div class="battery">
          <div class="battery-top">
            <span class="metric-label">배터리</span>
            <span class="battery-charging" data-field="charging"></span>
          </div>

          <div class="battery-value">
            <strong data-field="battery">-</strong>
            <span>%</span>
          </div>

          <div class="battery-bar" aria-hidden="true">
            <i data-field="batteryBar"></i>
          </div>
        </div>

        <!-- 상태 정보 -->
        <dl class="metrics">
          <div>
            <dt>이동 상태</dt>
            <dd data-field="status">-</dd>
          </div>
          <div>
            <dt>현재 위치</dt>
            <dd data-field="location">-</dd>
          </div>
          <div>
            <dt>현재 목적지</dt>
            <dd data-field="target">-</dd>
          </div>
          <div>
            <dt>현재 서비스</dt>
            <dd data-field="service">-</dd>
          </div>
          <div data-row="mode">
            <dt>운영 모드</dt>
            <dd data-field="mode">-</dd>
          </div>
          <div>
            <dt>이동 요청</dt>
            <dd data-field="request">-</dd>
          </div>
        </dl>

        <footer class="robot-card-foot">
          <span>마지막 수신</span>
          <strong data-field="updated">-</strong>
        </footer>
      </article>
    </template>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/monitoring.js') }}"></script>
  </body>
</html>
